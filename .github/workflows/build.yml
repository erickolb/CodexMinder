name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build CodexMinder.csproj -c Release
      - run: dotnet run --project tests/CodexMinder.Tests.csproj
      - run: dotnet publish CodexMinder.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/CodexMinder
      - run: Compress-Archive -Path artifacts/CodexMinder/* -DestinationPath artifacts/CodexMinder-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodexMinder-win-x64
          path: artifacts/CodexMinder-win-x64.zip
